<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121b2c" media="(prefers-color-scheme: dark)" />
    <title>Offline · Aerosys</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #0f172a; --muted: #64748b; --primary: #0b5cab; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e2e8f0; --muted: #94a3b8; --primary: #4f9be8; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 22rem; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 20px 0 8px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: var(--primary); border: 0;
        border-radius: 10px; padding: 12px 24px; min-height: 44px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Aerosys needs an internet connection. Check your mobile data or Wi-Fi, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns.
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
