<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Apply the saved theme/view/density before React loads so the page never flashes the wrong theme.
         Mirrors src/appearance/AppearanceContext.tsx (same storage key and defaults). -->
    <script>
      (function () {
        var a = {};
        try { a = JSON.parse(localStorage.getItem("aerosys.appearance") || "{}"); } catch (e) {}
        var theme = a.theme || "light";
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.theme = theme;
        var view = a.view || "auto";
        if (a.v !== 2 && view === "classic") view = "auto";
        if (view === "auto") view = matchMedia("(max-width: 767.98px), (hover: none) and (pointer: coarse)").matches ? "field" : "classic";
        root.dataset.view = view;
        root.dataset.density = a.density || "default";
      })();
    </script>
    <title>Aerosys HVAC · Project & Operations</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
