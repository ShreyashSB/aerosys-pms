# Runs on every push and pull request: builds and tests both apps,
# runs the API's end-to-end tests against a throwaway Postgres,
# and checks that the API's Docker image builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aerosys
          POSTGRES_PASSWORD: aerosys
          POSTGRES_DB: aerosys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerosys"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aerosys:aerosys@localhost:5432/aerosys_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @aerosys/api test:e2e

  docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t aerosys-api .
